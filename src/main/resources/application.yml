spring:
  application:
    name: sukiverse
  profiles:
    active: local
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  cache:
    type: redis
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 타임스탬프 형식으로 버전을 관리하기 때문에, 나중에 생성됐지만 먼저 머지된 낮은 버전의 마이그레이션도 적용되도록 허용
    out-of-order: true
