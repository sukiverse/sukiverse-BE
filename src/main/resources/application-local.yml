spring:
  datasource:
    url: jdbc:mysql://localhost:3307/sukiverse?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:sukiverse}
    password: ${DB_PASSWORD:sukiverse}
  jpa:
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}

logging:
  level:
    org.hibernate.SQL: debug
