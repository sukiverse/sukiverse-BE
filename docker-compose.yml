services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: sukiverse
      MYSQL_USER: sukiverse
      MYSQL_PASSWORD: sukiverse
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7
    ports:
      - "6380:6379"

volumes:
  mysql-data:
